name: CI

# 推送 main / 提交 PR 时跑项目门禁：构建（0 警告）→ 格式检查 → 单元测试；纯文档改动（*.md）不触发
on:
  push:
    branches: [main]
    paths-ignore:
      # 纯文档改动不跑门禁
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 钉住 SDK 补丁带：NativeAOT 会把运行时编进二进制，安全补丁只有用新 SDK 重编才生效；
      # 不钉的话用哪一版取决于 runner 镜像自带，补丁可能悄悄漏掉
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 工具链版本
        run: dotnet --info | head -12

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 构建（警告视为错误）
        run: dotnet build -c Release -warnaserror

      - name: 格式检查
        run: dotnet format --verify-no-changes --no-restore

      - name: 单元测试
        run: dotnet test -c Release --no-build --no-restore
