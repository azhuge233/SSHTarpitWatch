name: Release

# 推送 v* 标签 → 出 linux-x64 发布包并建 Release（附 tar.gz 与校验和）
# 手动触发   → 只构建打包（产物存为工作流附件，可下载试跑，不发 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 构建（警告视为错误）
        run: dotnet build -c Release -warnaserror

      - name: 格式检查
        run: dotnet format --verify-no-changes --no-restore

      - name: 单元测试
        run: dotnet test -c Release --no-build --no-restore

  package:
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 安装 NativeAOT 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: 构建宿主信息
        run: |
          echo "glibc: $(ldd --version | head -1)"
          echo "clang: $(clang --version | head -1)"

      - name: 打包（复用仓库内脚本）
        run: bash scripts/package-release.sh

      - name: 校验标签与产物版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          name=$(basename "$(ls dist/sshtarpitwatch-*-linux-x64.tar.gz)")
          version=${name#sshtarpitwatch-}
          version=${version%-linux-x64.tar.gz}
          echo "产物版本 = $version ／ 标签 = ${GITHUB_REF_NAME}"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 csproj 版本 v$version 不一致"
            exit 1
          fi

      - name: 校验 glibc 门槛不高于 2.34
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          tar -xzf dist/sshtarpitwatch-*-linux-x64.tar.gz -C "$tmp"
          bin=$(find "$tmp" -maxdepth 2 -type f -name sshtarpitwatch)
          floor=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)
          echo "产物要求的最高 glibc 符号版本 = GLIBC_$floor（README 承诺 glibc ≥ 2.34）"
          highest=$(printf '%s\n2.34\n' "$floor" | sort -uV | tail -1)
          if [ "$highest" != "2.34" ]; then
            echo "::error::glibc 门槛已升至 $floor，超出 README 承诺的 2.34"
            exit 1
          fi

      - name: 生成校验和
        run: |
          cd dist
          sha256sum sshtarpitwatch-*-linux-x64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          if-no-files-found: error
          path: |
            dist/sshtarpitwatch-*-linux-x64.tar.gz
            dist/SHA256SUMS.txt

  image:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: dist

      - name: 准备构建上下文（二进制 + Dockerfile）
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg /tmp/imgctx
          tar -xzf dist/sshtarpitwatch-*-linux-x64.tar.gz -C /tmp/pkg --strip-components=1
          cp /tmp/pkg/sshtarpitwatch /tmp/imgctx/
          cp Dockerfile .dockerignore /tmp/imgctx/
          ls -l /tmp/imgctx

      - name: 构建镜像
        run: docker build /tmp/imgctx -t sshtarpitwatch:ci

      - name: 冒烟测试（加固参数 + 端口连通 + 优雅退出）
        run: |
          set -euo pipefail
          mkdir -p /tmp/cfg
          printf '{"nickname":"ci-smoke","port":2222}\n' > /tmp/cfg/config.json
          chmod 644 /tmp/cfg/config.json
          docker run -d --name smoke \
            --read-only --tmpfs /tmp \
            --cap-drop=ALL --security-opt no-new-privileges:true \
            --pids-limit 256 --memory 128m \
            -p 127.0.0.1::2222 \
            -v /tmp/cfg:/data:ro -v /etc/localtime:/etc/localtime:ro \
            sshtarpitwatch:ci
          sleep 2
          docker logs smoke 2>&1 | grep -q 'LISTEN' || { docker logs smoke; echo "::error::容器未监听"; exit 1; }
          port=$(docker port smoke 2222 | head -1 | awk -F: '{print $2}')
          timeout 3 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port" || { echo "::error::宿主端口不可连接"; docker logs smoke; exit 1; }
          docker stop smoke >/dev/null
          docker logs smoke 2>&1 | grep -q 'TOTALS' || { docker logs smoke; echo "::error::未打印 TOTALS（优雅退出异常）"; exit 1; }
          docker rm -f smoke
          echo "冒烟测试通过"

      - name: 登录 Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 仓库 Secret"
            exit 1
          fi
          # 令牌经 stdin 传入（绝不出现在命令行参数里——argv 会被进程列表捕获）；
          # 本步骤不开 set -x；即便误开，GitHub 也会把 Secret 值打码为 ***
          printf '%s\n' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: 打标签并推送
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          name=$(basename "$(ls dist/sshtarpitwatch-*-linux-x64.tar.gz)")
          version=${name#sshtarpitwatch-}
          version=${version%-linux-x64.tar.gz}
          [ "$version" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::产物版本与标签不一致"; exit 1; }
          img="azhuge233/sshtarpitwatch"
          docker tag sshtarpitwatch:ci "$img:$version"
          docker tag sshtarpitwatch:ci "$img:latest"
          docker push "$img:$version"
          docker push "$img:latest"
          echo "已推送 $img:$version 与 :latest"

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SSHTarpitWatch ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/sshtarpitwatch-*-linux-x64.tar.gz \
            dist/SHA256SUMS.txt
